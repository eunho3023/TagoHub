# TagoHub 공공데이터 중계 서버 (Cloudflare Workers 무료 요금제: 하루 10만 요청)
# 비밀 값은 이 파일에 쓰지 않고 `npx wrangler secret put` 으로 넣음 (DATA_GO_KR_KEY, APP_TOKEN) — README.md
# 지난 운행 기록 데이터베이스(D1 tagohub-log)는 deploy.ps1 이 만들고 wrangler.deploy.toml 에 연결해서 배포함
name = "tagohub-proxy"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 정적 파일: 정류장·노선 자료 조각(public/data, deploy.ps1 이 만듦 — 저장소에는 안 올림). 파일이 있는 주소는 서버 코드를 거치지 않고 바로 나감
[assets]
directory = "./public"
# 서버 코드가 노선 조각을 읽을 때 (노선 도로 모양 만들기, src/shape.js)
binding = "ASSETS"

# 웹 버전(/w/, 토큰 없음)의 주소(IP)마다 요청 수 제한: 1분에 120번
[[ratelimits]]
name = "WEB_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
