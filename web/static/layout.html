<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TagoHub 배치도 편집기</title>
<style>
  :root { --bg:#0f1720; --panel:#16212e; --line:#2a3a4d; --text:#e7eef7; --sub:#93a4b8; --on:#2f81f7; --chip:#1f3b5c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Noto Sans KR", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; background: #0f1720f2; border-bottom: 1px solid var(--line); }
  input[type=text], input[type=number] { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: #0e1720; color: var(--text); font: inherit; }
  #q { width: 130px; }
  button, .file { border: 1px solid var(--line); background: #1b2836; color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover, .file:hover { border-color: #3d5a78; background: #223244; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: var(--on); border-color: var(--on); color: #fff; }
  .file { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
  .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #name { flex: 1; min-width: 140px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #save { color: var(--sub); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 10px; padding: 10px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  #gridWrap { overflow-x: auto; }
  #grid { display: grid; grid-template-columns: repeat(4, minmax(72px, 1fr)); gap: 6px; min-width: 320px; }
  .cell { position: relative; min-height: 76px; border: 1px dashed #2f4459; border-radius: 10px; background: #111c27; padding: 4px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
  .cell.over { border-color: var(--on); background: #16283c; }
  .cell .axis { position: absolute; right: 4px; top: 2px; font-size: 10px; color: #4d6a86; }
  .chip { display: flex; gap: 5px; align-items: center; border: 1px solid #2d4b6b; background: var(--chip); border-radius: 7px; padding: 3px 5px; font-size: 12px; line-height: 1.25; cursor: pointer; overflow: hidden; }
  .chip b { color: #9fc3ea; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.sel { outline: 2px solid #e3b341; outline-offset: 1px; }
  #tray { display: flex; flex-direction: column; gap: 4px; max-height: 420px; overflow: auto; }
  #tray .chip { background: #22303f; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .label { color: var(--sub); font-size: 12px; }
  #hint { position: fixed; left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; font-size: 13px; background: #0e1720ee; border: 1px solid var(--line); border-radius: 10px; color: #cfe0f3; pointer-events: none; }
  #hint:empty { display: none; }
</style>
</head>
<body>
<header>
  <input id="q" inputmode="numeric" placeholder="노선 번호" aria-label="노선 번호">
  <button id="find">조회</button>
  <span id="name">노선 번호를 넣고 조회하세요</span>
  <span id="save">저장 안 됨</span>
</header>

<main>
  <section class="panel">
    <div id="gridWrap"><div id="grid"></div></div>
    <div class="row">
      <button id="auto">자동 배치(ㄹ자)</button>
      <button id="rowAdd">행 추가</button>
      <button id="rowDel">행 줄이기</button>
      <button id="clear">비우기</button>
      <span class="label">정류장을 누른 뒤 칸을 누르면 그 자리로 옮겨집니다. 방향키로도 한 칸씩 움직입니다.</span>
    </div>
    <div class="row">
      <label class="file">좌표 파일 가져오기<input type="file" id="file" accept=".tsv,.txt,.json"></label>
      <button id="tsvSave">TSV 저장</button>
      <button id="jsonSave">JSON 저장</button>
    </div>
  </section>

  <aside class="panel">
    <div class="label" style="margin-bottom:6px">배치 안 된 정류장</div>
    <div id="tray"></div>
  </aside>
</main>

<div id="hint"></div>
<script src="layout-format.js"></script>
<script src="layout.js"></script>
</body>
</html>
