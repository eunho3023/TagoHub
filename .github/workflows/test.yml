# PR·main 에 올라올 때마다 단위 테스트를 자동으로 돌린다 (키가 필요 없는 테스트라서 GitHub 기본 서버에서 실행)
name: 단위 테스트

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 열차 시간표 만드는 프로그램 시험 (파이썬, 인터넷 없이)
        run: python3 pipeline/test_train_timetable.py

      - name: 단위 테스트
        # local.properties 가 없어도 빌드되도록 되어 있음(키는 빈 문자열). 테스트는 인터넷·키 없이 돈다
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 실패한 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
